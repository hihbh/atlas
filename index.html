<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كابتن كيشو – حجز تمارين كرة اليد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap">
<meta name="theme-color" content="#090806"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0b0a08;--card:#16130d;--ink:#f3e9cf;--mut:#a8996f;--blue:#d3a140;--line:#33291a;--off:#3a3222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
header{background:var(--card);color:var(--ink);padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
header b{font-size:22px;flex:1;text-align:center;letter-spacing:.5px;font-weight:800}
header svg{width:30px;height:30px}
header button{background:none;color:var(--ink);border:0;padding:4px;cursor:pointer;display:flex}
main{max-width:640px;margin:0 auto;padding:18px}
h2{margin:6px 0 14px;font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero{background:linear-gradient(135deg,#0b0a08 0%,#a57a2a 100%);color:#fff;border-radius:22px;padding:30px 20px;margin-bottom:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.hero h1{margin:0;font-size:28px;font-weight:900}
.hero p{margin:6px 0 0;opacity:.85}
.hero{min-height:160px}
.hero h1,.hero p{max-width:58%}
.hero svg{position:absolute;left:10px;bottom:8px;width:42%;max-width:210px}
.big{background:var(--card);border:0;border-bottom:5px solid var(--blue);border-radius:18px;padding:26px 10px 20px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.14);transition:transform .15s}
.big:hover{transform:translateY(-4px)}
.big .ic{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,#a57a2a,#e6c071);display:flex;align-items:center;justify-content:center}
.big svg{width:48px;height:48px;color:#fff}
.big b{display:block;font-size:20px;font-weight:800}
.big small{color:var(--mut)}
.opts{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.opt{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:20px;padding:22px 18px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.10)}
.opt .txt{flex:1}
.opt h3{margin:0;font-size:28px;font-weight:800;direction:ltr;text-align:right}
.opt p{margin:4px 0 12px;opacity:.85;font-size:15px}
.pill{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#a57a2a,#e6c071);color:#0a0a0a;border-radius:30px;padding:11px 20px;font-weight:700;font-size:17px}
.pill svg{width:18px;height:18px}
.sep{width:1px;align-self:stretch;background:var(--line)}
.circ{position:relative;width:112px;height:112px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.circ .main{width:62px;height:62px;color:var(--ink)}
.circ i{position:absolute;width:3px;height:22px;background:var(--blue);border-radius:2px;transform:rotate(40deg)}
.circ i:nth-child(1){top:0;right:4px}
.circ i:nth-child(2){bottom:0;left:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{flex:none;padding:10px 18px;border-radius:30px;border:1.5px solid var(--blue);background:var(--card);color:var(--blue);font:inherit;font-weight:700;cursor:pointer}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#0a0a0a}
.time{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;color:var(--blue)}
.time svg{width:20px;height:20px}
.place{display:flex;align-items:center;gap:6px;color:var(--mut);margin:6px 0}
.place svg{width:18px;height:18px;color:var(--blue);flex:none}
.mybk{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:14px;border-radius:30px;border:2px solid var(--blue);background:none;color:var(--blue);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.mybk svg{width:22px;height:22px}
.x{display:flex;align-items:center;gap:4px;background:none;border:1.5px solid #d33;color:#d33;border-radius:10px;padding:6px 10px;font:inherit;cursor:pointer;flex:none}
.x svg{width:16px;height:16px}
.x.arm{background:#d33;color:#fff}
main{padding:14px}
header{padding:10px 14px}
header b{font-size:19px}
header svg{width:26px;height:26px}

.banner h1{margin:0;font-size:20px;font-weight:900;line-height:1.35}
.banner p{margin:4px 0 0;font-size:13px;opacity:.9}
.opts{gap:12px;margin-top:0}
.opt{gap:12px;padding:14px;border-radius:16px}
.opt h3{font-size:22px}
.opt p{margin:2px 0 10px;font-size:13px}
.pill{padding:8px 16px;font-size:15px}
.circ{width:76px;height:76px}
.circ .main{width:42px;height:42px}
.circ i{height:16px}
.mybk{margin-top:12px;padding:11px;font-size:15px}
.info{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:12px;border-right:4px solid var(--blue)}
.info svg{width:26px;height:26px;color:var(--blue);flex:none}
.info small{color:var(--mut)}
.sw{display:flex;align-items:center;gap:12px;margin:14px 0;cursor:pointer;font-weight:600}
.sw small{font-weight:400;color:var(--mut)}
.sw input{display:none}
.knob{width:46px;height:26px;border-radius:20px;background:var(--off);position:relative;flex:none;transition:.2s}
.knob:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+.knob{background:var(--blue)}
.sw input:checked+.knob:after{right:23px}
.slot.mine{text-decoration:none;opacity:.75}
.wa{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px;border-right:4px solid #25d366}
.wa b{font-size:17px}
.wa a{display:flex;align-items:center;gap:6px;background:#25d366;color:#fff;text-decoration:none;border-radius:20px;padding:8px 14px;font-weight:700;flex:none}
.wa a svg{width:18px;height:18px}
.banner h1.brand{font-size:36px;letter-spacing:1px;direction:ltr;font-weight:900}
.circ.g{background:var(--blue)}
.circ.g .main{color:#0a0a0a}
.card{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--blue);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dot{width:20px;height:20px;border-radius:50%;background:var(--off)}
.dot.on{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.btn{background:var(--blue);color:#0a0a0a;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{background:var(--off);color:var(--mut);cursor:not-allowed}
.ghost{background:none;color:var(--blue);border:0;font:inherit;cursor:pointer;padding:0 0 10px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:13px;color:var(--mut)}
label{display:block;margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--off) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mut);margin:0 auto;cursor:pointer;font-size:12px;text-align:center}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{padding:8px 14px;border:1.5px solid var(--blue);border-radius:10px;background:none;color:var(--blue);font:inherit;cursor:pointer}
.slot.sel{background:var(--blue);color:#0a0a0a}
.slot:disabled{border-color:var(--off);color:var(--mut);text-decoration:line-through;cursor:not-allowed}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--blue);color:#0a0a0a;font-weight:700;padding:10px 20px;border-radius:12px;display:none}
.note{color:var(--mut);font-size:13px;margin-top:18px;text-align:center}

#loader{position:fixed;inset:0;z-index:99;background:#090806;display:flex;flex-direction:column;align-items:center;transition:opacity .5s;padding-top:env(safe-area-inset-top,0px)}
#loader.out{opacity:0;pointer-events:none}
#loader img{flex:1;min-height:0;width:100%;object-fit:contain;object-position:center;animation:lin 1s ease-out both}
#loader .bar{width:min(52vw,200px);height:4px;border-radius:4px;background:#2a2314;margin:0 0 calc(34px + env(safe-area-inset-bottom,0px));overflow:hidden;flex:none}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a57a2a,#edcd84);border-radius:4px;animation:fill 1.4s ease-out forwards}
@keyframes lin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes fill{to{width:100%}}
header b{color:var(--blue)}header{border-bottom:1px solid var(--line)}
.card,.opt,.me,.info,.wa{border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;border-right:4px solid var(--blue);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.me .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#a57a2a,#e6c071);color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.me .txt{flex:1;min-width:0}
.me b{display:block}
.me small{color:var(--mut)}
.me .ghost{padding:0;flex:none}
.err{color:#d33;font-size:13px;margin-top:4px;min-height:18px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.st b{display:block;font-size:20px;color:var(--blue)}.st small{color:var(--mut);font-size:12px}
.ab{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.s{padding:6px 14px;font-size:14px}
.adm-badge{background:var(--blue);color:#0a0a0a;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:800;margin-inline-start:8px}
.banner{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
</style>
</head>
